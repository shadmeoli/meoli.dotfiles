# Headless/SSH-safe tmux configuration.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:clipboard"
set -g set-clipboard on
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 200000
set -sg escape-time 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

set -g status-position top
set -g status-interval 3
set -g status-justify centre
set -g status-style "bg=default,fg=#f8f8f2"
set -g pane-border-style "fg=#3e3d32"
set -g pane-active-border-style "fg=#75715e"
set -g window-status-format "#[fg=#f8f8f2] #I:#W "
set -g window-status-current-format "#[fg=#66d9ef,bold] #I:#W "
set -g message-style "bg=default,fg=#fd971f"
set -g mode-style "bg=#272822,fg=#a6e22e"
set -g status-left " #[fg=#a6e22e]tmux #[fg=#f8f8f2]#S "
set -g status-right "#[fg=#75715e]#{b:pane_current_path} #[fg=#fd971f]%H:%M "
set -g status-left-length 80
set -g status-right-length 120

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'aserowy/tmux.nvim'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

if-shell 'test -x "$HOME/.local/share/tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"' \
  'if-shell '\''test -x "$HOME/.config/tmux/plugins/tpm/tpm"'\'' '\''run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'\'''
